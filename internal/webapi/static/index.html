<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant Interface</title>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />

    <script src="app.js"></script>
    <style>
    [x-cloak] { display: none !important; }
    .message pre {
        margin: 1em 0;
        padding: 1em;
        border-radius: 0.375rem;
        background: #f8f9fa;
    }
    .message code {
        font-family: ui-monospace, monospace;
        font-size: 0.9em;
    }
    .message p {
        margin-bottom: 1em;
    }
    .message ul, .message ol {
        margin-bottom: 1em;
        padding-left: 2em;
    }
    .message h1, .message h2, .message h3, .message h4 {
        margin: 1em 0 0.5em 0;
        font-weight: bold;
    }
    .message h1 { font-size: 1.5em; }
    .message h2 { font-size: 1.3em; }
    .message h3 { font-size: 1.1em; }
</style>
</head>
<body class="bg-gray-50">
    <div x-data="chat" class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-3 gap-6">
            <!-- Chat Section -->
            <div class="col-span-2 bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-4">Chat</h2>
                <div id="chat-history" 
                     class="h-[400px] overflow-y-auto border border-gray-200 rounded-lg p-4 mb-4">
                    <template x-for="message in messages" :key="message.id">
                        <div :class="{
                            'message mb-3 p-3 rounded-lg': true,
                            'bg-blue-50 ml-4': message.type === 'user',
                            'bg-gray-50 mr-4': message.type === 'assistant'
                        }">
                            <div x-html="renderMessage(message.content)"></div>
                        </div>
                    </template>
                </div>
                
                <div class="flex gap-3">
                    <input type="text" 
                           x-model="newMessage"
                           @keyup.enter="sendMessage"
                           class="flex-1 border border-gray-300 rounded-lg px-4 py-2"
                           placeholder="Type your message...">
                    <button @click="sendMessage"
                            class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">
                        Send
                    </button>
                </div>

                <div id="event-log" 
                     class="mt-6 h-[200px] overflow-y-auto bg-gray-900 text-gray-200 font-mono p-4 rounded-lg">
                    <template x-for="event in events" :key="event.id">
                        <div class="event-entry border-b border-gray-700 pb-1 mb-2" 
                             x-text="event.message">
                        </div>
                    </template>
                </div>
            </div>

            <!-- Files Section -->
            <div class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-bold mb-4">Files</h2>
                <div class="flex gap-3 mb-4">
                    <input type="file" 
                           id="file-input"
                           multiple
                           class="flex-1">
                    <button @click="uploadFiles"
                            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                        Upload
                    </button>
                </div>

                <ul class="space-y-2">
                    <template x-for="file in files" :key="file.name">
                        <li class="flex justify-between items-center p-2 border-b border-gray-100">
                            <span x-text="file.name"></span>
                            <button @click="removeFile(file.name)"
                                    class="text-red-500 hover:text-red-600">
                                Remove
                            </button>
                        </li>
                    </template>
                </ul>
            </div>
        </div>
        <!-- Status Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-gray-800 text-white p-2 text-center">
            <span x-text="status"></span>
        </div>

        <div x-show="showModal" 
             x-transition:enter="ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
             @click.self="showModal = false">
            <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                <h3 class="text-xl font-bold mb-4">Confirmation Required</h3>
                <p class="mb-6" x-text="modalMessage"></p>
                <div class="flex justify-end gap-3">
                    <button @click="handleModalResponse(false)"
                            class="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300 transition">
                        Cancel
                    </button>
                    <button @click="handleModalResponse(true)"
                            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                        Confirm
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
